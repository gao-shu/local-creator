# OpenSpec configuration for haode-ai-client

schema: spec-driven

context: |
  产品：好的漫创（haode-ai-client）
  技术栈：Electron 30 + electron-vite · React 18 + TypeScript · Zustand 5 · Radix + Tailwind 4
  别名：@/ → src/*
  架构约束：
  - Renderer 禁止直接 Node API；文件 IO 走 IPC
  - 最小 diff；不硬编码 Key；不擅自 commit
  - Conventional Commits；新 TS 文件加版权头
  相关模块：
  - 工具箱 /toolbox：卡片 → Modal → 单用途工具（现有 video-merge、image-crop）
  - 创作工坊 /workshop：四步流水线，Step1 剧本为平文本 script（≤50000 字）
  - LLM：callChatCompletions / pickMergedLlmModel；非流式；支持 AbortSignal；默认 haodouReason=consume_script
  - 蓝图明确不做：独立「我的剧本」入口（剧本数据在工作流内）
  文档索引：docs/PROJECT_BLUEPRINT.md、docs/ARCHITECTURE.md

rules:
  proposal:
    - 变更必须明确与创作工坊的边界，避免做成第二个工坊
    - 涉及扣豆 / LLM 的工具须写明配置校验与失败体验
  design:
    - 优先复用现有 lib（llm-client、script-file-import、workflow-service）
    - 结构化 UI 与送工坊落库字段必须定义序列化规则
  tasks:
    - 按 Phase 0 / Phase 1 拆分；Phase 0 可独立验收
    - 任务粒度保持 1～2 小时可完成
  specs:
    - Requirement 使用 SHALL / MUST 语义（中文用「必须」）
    - Scenario 使用 WHEN / THEN 结构
