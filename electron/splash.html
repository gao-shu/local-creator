<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地漫创</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        color: #fff;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 32px 40px 28px;
        user-select: none;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 18px;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(168, 85, 247, 0.25));
      }
      .title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 8px;
      }
      .tagline {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        margin-bottom: 36px;
      }
      .progress-track {
        width: min(280px, 72vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-bottom: 14px;
      }
      .progress-bar {
        height: 100%;
        width: 36%;
        border-radius: inherit;
        background: linear-gradient(90deg, #9333ea, #ec4899, #f97316);
        animation: splash-progress 1.4s ease-in-out infinite;
      }
      .status {
        min-height: 18px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.02em;
      }
      @keyframes splash-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img id="splash-logo" class="logo" alt="本地漫创" />
      <div class="title">本地漫创</div>
      <div class="tagline">本地 AI 漫剧创作</div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar"></div>
      </div>
      <div class="status" id="status">正在启动…</div>
    </div>
    <script>
      ;(function () {
        var logo = new URLSearchParams(location.search).get('logo')
        var logoNode = document.getElementById('splash-logo')
        if (logo && logoNode) logoNode.src = logo

        var lines = ['正在启动…', '正在加载工作台…', '正在初始化…']
        var index = 0
        var node = document.getElementById('status')
        if (!node) return
        setInterval(function () {
          index = (index + 1) % lines.length
          node.textContent = lines[index]
        }, 900)
      })()
    </script>
  </body>
</html>
