<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>本地漫创</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --text: #f5f5f5;
        --muted: rgba(255, 255, 255, 0.55);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }
      .wrap { max-width: 520px; text-align: center; }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin: 0 0 12px;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>本地漫创</h1>
      <p>私有阶段占位页。安装包与自动更新将在配置自有发布地址后提供（见 docs/phases/P6）。</p>
    </div>
  </body>
</html>
