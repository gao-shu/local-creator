<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>好的漫创 · 下载</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --text: #f5f5f5;
        --muted: rgba(255, 255, 255, 0.55);
        --green: #22c55e;
        --green-hover: #16a34a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.12), transparent 45%), var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      .page {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }
      .wrap { max-width: 720px; text-align: center; }
      h1 {
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 12px;
      }
      .subtitle {
        font-size: 1.125rem;
        color: var(--muted);
        margin: 0 0 20px;
      }
      .desc {
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.7;
        margin: 0 auto 36px;
        max-width: 560px;
      }
      .actions {
        display: flex;
        flex-wrap: nowrap;
        gap: 12px;
        justify-content: center;
        align-items: stretch;
        margin-bottom: 20px;
      }
      @media (max-width: 560px) {
        .actions {
          flex-wrap: wrap;
        }
      }
      a.btn,
      span.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 24px;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a.btn:hover { transform: translateY(-1px); }
      a.btn-primary {
        background: var(--green);
        color: #041007;
      }
      a.btn-primary:hover { background: var(--green-hover); color: #fff; }
      a.btn-secondary,
      span.btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      span.btn-disabled {
        opacity: 0.42;
        cursor: not-allowed;
        user-select: none;
      }
      .meta {
        font-size: 0.8125rem;
        color: var(--muted);
        line-height: 1.8;
      }
      .meta-updated {
        display: block;
        margin-top: 6px;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.42);
      }
      footer {
        flex-shrink: 0;
        width: 100%;
        padding: 20px;
        text-align: center;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.35);
        line-height: 1.7;
      }
      footer a {
        color: rgba(255, 255, 255, 0.45);
        text-decoration: none;
      }
      footer a:hover {
        color: rgba(255, 255, 255, 0.65);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      footer .sep {
        margin: 0 6px;
        opacity: 0.55;
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="wrap">
      <h1>好的漫创</h1>
      <p class="subtitle">AI 驱动的漫剧 / 短剧创作桌面工具</p>
      <p class="desc">
        支持剧本解析、角色与场景管理、分镜与 AI 生图/生视频等创作流程。下载桌面客户端，在本地完成从剧本到成片的主要工作。
      </p>
      <div class="actions">
        <a id="btn-win-tos" class="btn btn-primary hidden" href="#" download>
          ⬇ 下载 Windows 版
        </a>
        <span id="btn-mac-soon" class="btn btn-secondary btn-disabled">
          下载 macOS 版本 (M 系列)
        </span>
      </div>
      <p class="meta" id="version-meta">正在加载版本信息…</p>
      <p class="meta meta-updated hidden" id="updated-meta"></p>
      </div>
    </main>
    <footer>
      © HaodeAI · 好的漫创
      <br />
      haodeweishi.cn <span class="sep">·</span>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">豫ICP备2026016510号-1</a>
    </footer>
    <script>
      async function loadVersion() {
        const meta = document.getElementById('version-meta')
        const updatedMeta = document.getElementById('updated-meta')
        const btnWinTos = document.getElementById('btn-win-tos')
        try {
          const res = await fetch('version.json?t=' + Date.now())
          const data = await res.json()
          const version = data.version || '0.1.0'
          meta.textContent =
            '当前版本 v' +
            version +
            ' · Windows 安装包 (.exe) · macOS 版本开发中（M 系列）'

          if (data.updatedAt) {
            updatedMeta.textContent = '最近更新：' + data.updatedAt
            updatedMeta.classList.remove('hidden')
          } else {
            updatedMeta.classList.add('hidden')
          }

          if (data.windowsDirectUrl) {
            btnWinTos.href = data.windowsDirectUrl
            btnWinTos.classList.remove('hidden')
          }
        } catch (e) {
          meta.textContent = '暂时无法加载版本信息，请稍后重试或联系管理员。'
          console.error(e)
        }
      }
      loadVersion()
    </script>
  </body>
</html>
