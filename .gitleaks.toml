title = "haode-ai-client gitleaks"

[extend]
useDefault = true

[allowlist]
description = "示例配置、占位符、本地模式 token"
paths = [
  '''\.env\.example$''',
  '''BUG-REGISTRY\.md$''',
  '''\.cursor/skills/''',
  '''\.agents/''',
]
regexes = [
  '''你的AccessKey''',
  '''你的SecretKey''',
  '''offline-local-token''',
  '''users\.noreply\.github\.com''',
  '''example\.com''',
]
